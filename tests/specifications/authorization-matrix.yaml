# Executable authorization specification.
#
# This file is the independently reviewed source of expected authorization outcomes.
# Tests read it; it is never generated from the implementation. Changing an expected
# outcome is a specification change and must be justified in the pull request (and an ADR
# where semantics change).
#
# principal: Keycloak username from infra/keycloak/realm-virtual-bank.json
# resource:  <resource type>:<id>; customers and credit applications resolve their attributes
#            from infra/seed/fixtures.json, other types are capability resources
# action:    canonical permission ID of the attempted operation
# expected:  allow | deny
# reason:    expected internal reason code (optional, checked when present)
# status:    active (default) | planned. A planned case specifies a module that does not exist yet
#            (module, target milestone). It is checked against the design policy and must be denied
#            with NO_POLICY by every running service until the module ships; then it becomes active.

version: 1
milestone: M2

cases:
